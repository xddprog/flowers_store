services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres123
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres123
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres123 -U postgres123 -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_NAME: postgres123
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres123
      DB_PASS: postgres123
      SMTP_PASSWORD: local
      SMTP_USER: local@example.com
      SMTP_PORT: 587
      SMTP_HOST: localhost
      SECRET_KEY: local-dev-secret
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 3
      ADMIN_CHAT_ID: ""
      BOT_TOKEN: ""
      APP_NAME: lascovo-local-backup
      DEBUG: "true"
      STATIC_URL: http://localhost:18000/static/images
      CORS_ALLOWED_ORIGINS: http://localhost:15173,http://localhost:5173
      API_URL: https://pay.yandex.ru
      ON_ERROR_REDIRECT_URL: http://localhost:15173/
      ON_SUCCESS_REDIRECT_URL: http://localhost:15173/
      ON_ABORT_REDIRECT_URL: http://localhost:15173/
      CALLBACK_URL: http://localhost:18000/api/v1/order/callback
      REQUEST_TIMEOUT: 10
      MAX_RETRIES: 3
      API_KEY: local
      MAX_IMAGE_SIZE_MB: 10
      WEBP_QUALITY: 85
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18000:8000"
    volumes:
      - ../local_backup_runtime/static:/app/static

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:18000
    depends_on:
      - app
    ports:
      - "15173:80"
